
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050814"
    >

    <title>Fun X Radio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= BACKGROUND ================= -->

    <div class="background">

        <div class="stars" id="stars"></div>

        <div class="moon">
            <span></span>
        </div>

        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

    </div>


    <!-- ================= APP ================= -->

    <main class="app">

        <!-- HEADER -->

        <header class="topbar">

            <div class="brand">

                <div class="brand-logo">
                    FX
                </div>

                <div>

                    <strong>
                        Fun X
                    </strong>

                    <small>
                        Radio
                    </small>

                </div>

            </div>


            <div class="live-badge">

                <span></span>

                LIVE

            </div>

        </header>


        <!-- ================= RADIO CARD ================= -->

        <section class="radio-card">

            <div class="radio-icon">
                📻
            </div>


            <div class="eyebrow">
                FUN X RADIO
            </div>


            <h1>
                الراديو
                <span>على مزاجك</span>
            </h1>


            <p class="subtitle">
                استمع إلى محطاتك المفضلة من مكان واحد
            </p>


            <!-- CURRENT STATION -->

            <div class="station-box">

                <div class="station-cover">

                    <span id="stationEmoji">
                        📻
                    </span>

                </div>


                <div class="station-info">

                    <small>
                        المحطة الحالية
                    </small>

                    <h2 id="stationName">
                        إذاعة القرآن الكريم – القاهرة
                    </h2>

                    <div class="station-status">

                        <span></span>

                        البث متاح

                    </div>

                </div>

            </div>


            <!-- PLAYER -->

            <div class="player">

                <div class="equalizer" id="equalizer">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="player-label">

                    <span>
                        الآن تستمع
                    </span>

                    <strong id="playerStatus">
                        جاهز للتشغيل
                    </strong>

                </div>

            </div>


            <!-- IFRAME -->

            <div class="frame-wrapper">

                <iframe
                    id="radioFrame"
                    src="https://p.liveonlineradio.net/?p=ertu-quran-karem"
                    title="Fun X Radio"
                    scrolling="no"
                    allow="autoplay">
                </iframe>

            </div>


            <!-- CONTROLS -->

            <div class="controls">

                <button
                    id="prevBtn"
                    class="control-btn"
                    type="button"
                    title="المحطة السابقة">

                    ⏮

                </button>


                <button
                    id="refreshBtn"
                    class="main-control"
                    type="button"
                    title="إعادة تحميل المحطة">

                    🔄

                </button>


                <button
                    id="nextBtn"
                    class="control-btn"
                    type="button"
                    title="المحطة التالية">

                    ⏭

                </button>

            </div>


            <!-- STATION LIST -->

            <div class="station-heading">

                <div>

                    <strong>
                        المحطات
                    </strong>

                    <small>
                        اختر محطة للاستماع
                    </small>

                </div>

                <span id="stationCounter">
                    1 / 3
                </span>

            </div>


            <div
                id="stationList"
                class="station-list">
            </div>


            <!-- FOOTER INFO -->

            <div class="radio-footer">

                <div>
                    🕒
                    <span id="clock">
                        00:00:00
                    </span>
                </div>

                <div>
                    🎧 استمع واستمتع
                </div>

            </div>

        </section>


        <footer>
            Fun X Radio © 2026
        </footer>

    </main>


    <!-- TOAST -->

    <div
        id="toast"
        class="toast">

        تم التنفيذ

    </div>


    <script src="script.js"></script>

</body>

</html>
