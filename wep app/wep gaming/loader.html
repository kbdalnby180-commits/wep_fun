
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#03060d"
    >

    <title>FUN X — Loading</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {

            margin: 0;

            overflow: hidden;

            font-family:
                "Orbitron",
                "Segoe UI",
                Arial,
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at center,
                    #111a30 0%,
                    #080d18 35%,
                    #03060d 75%,
                    #010204 100%
                );

            display: flex;

            align-items: center;
            justify-content: center;
        }


        /* =====================================================
           BACKGROUND GRID
        ===================================================== */

        .grid {

            position: fixed;

            inset: 0;

            background-image:
                linear-gradient(
                    rgba(59,130,246,.04) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(59,130,246,.04) 1px,
                    transparent 1px
                );

            background-size:
                45px 45px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black 0%,
                    transparent 80%
                );

            animation:
                gridMove
                20s
                linear
                infinite;

            pointer-events: none;

            z-index: -4;
        }

        @keyframes gridMove {

            from {
                transform:
                    translate(0, 0);
            }

            to {
                transform:
                    translate(45px, 45px);
            }
        }


        /* =====================================================
           GLOW
        ===================================================== */

        .glow {

            position: fixed;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(37,99,235,.18),
                    transparent 70%
                );

            filter:
                blur(65px);

            animation:
                pulse
                5s
                ease-in-out
                infinite;

            pointer-events: none;

            z-index: -3;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(.9);
                opacity: .55;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }


        /* =====================================================
           PARTICLES
        ===================================================== */

        .particles {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: -2;
        }

        .particle {

            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: #7098ff;

            opacity: .2;

            animation:
                particleMove
                linear
                infinite;
        }

        @keyframes particleMove {

            from {
                transform:
                    translateY(110vh);

                opacity: 0;
            }

            20% {
                opacity: .6;
            }

            80% {
                opacity: .2;
            }

            to {
                transform:
                    translateY(-20vh);

                opacity: 0;
            }
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .loader-screen {

            position: relative;

            width:
                min(
                    520px,
                    90vw
                );

            text-align: center;

            animation:
                screenIn
                .65s
                ease
                forwards;
        }

        @keyframes screenIn {

            from {
                opacity: 0;

                transform:
                    translateY(15px)
                    scale(.98);

                filter:
                    blur(6px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter:
                    blur(0);
            }
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            margin-bottom: 28px;

            font-size:
                clamp(
                    3.5rem,
                    14vw,
                    7rem
                );

            font-weight: 800;

            letter-spacing:
                clamp(
                    7px,
                    2vw,
                    18px
                );

            color: #fff;

            line-height: 1;

            text-shadow:
                0 0 15px
                rgba(255,255,255,.15),

                0 0 45px
                rgba(37,99,235,.25);
        }


        .logo span {

            color:
                #5d86ff;
        }


        /* =====================================================
           MAIN LOADER
        ===================================================== */

        .loader-box {

            padding:
                28px;

            border-radius:
                24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.07),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid
                rgba(255,255,255,.1);

            backdrop-filter:
                blur(20px);

            box-shadow:
                0 30px 90px
                rgba(0,0,0,.45);

            overflow: hidden;
        }


        /* =====================================================
           STATUS HEADER
        ===================================================== */

        .status-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 18px;

            color: #74839f;

            font-size: 9px;

            letter-spacing: 2px;

            text-transform:
                uppercase;
        }


        .status {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 12px
                rgba(34,197,94,.7);

            animation:
                statusPulse
                1.2s
                ease-in-out
                infinite
                alternate;
        }


        @keyframes statusPulse {

            from {
                opacity: .4;
            }

            to {
                opacity: 1;
            }
        }


        /* =====================================================
           CIRCLE
        ===================================================== */

        .circle-loader {

            position: relative;

            width: 125px;
            height: 125px;

            margin:
                5px auto 22px;
        }


        .circle {

            position: absolute;

            inset: 0;

            border-radius: 50%;

            border:
                2px solid
                rgba(255,255,255,.06);

            border-top-color:
                #4f76ff;

            border-right-color:
                rgba(79,118,255,.25);

            animation:
                spin
                1.1s
                linear
                infinite;

            box-shadow:
                0 0 35px
                rgba(37,99,235,.12);
        }


        .circle-inner {

            position: absolute;

            inset: 14px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(37,99,235,.13),
                    rgba(3,7,18,.95)
                );

            border:
                1px solid
                rgba(96,165,250,.12);
        }


        .percentage {

            font-size: 17px;

            color: #dbeafe;

            letter-spacing: 1px;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* =====================================================
           LOADING TEXT
        ===================================================== */

        .loading-title {

            margin:
                0 0 7px;

            color: #fff;

            font-size: 12px;

            letter-spacing: 2px;
        }


        .loading-subtitle {

            margin: 0 0 18px;

            color: #64748b;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            font-size: 11px;
        }


        /* =====================================================
           PROGRESS
        ===================================================== */

        .progress-track {

            width: 100%;

            height: 5px;

            overflow: hidden;

            border-radius:
                20px;

            background:
                rgba(255,255,255,.06);
        }


        .progress-bar {

            width: 0;

            height: 100%;

            border-radius:
                inherit;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #06b6d4
                );

            box-shadow:
                0 0 15px
                rgba(37,99,235,.5);

            transition:
                width
                .12s
                linear;
        }


        /* =====================================================
           LOADING STEPS
        ===================================================== */

        .steps {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 7px;

            margin-top: 20px;
        }


        .step {

            padding:
                9px 5px;

            border-radius:
                9px;

            color: #46536b;

            background:
                rgba(255,255,255,.025);

            font-size: 7px;

            letter-spacing: 1px;

            transition:
                .25s ease;
        }


        .step.active {

            color: #91aaff;

            background:
                rgba(37,99,235,.08);

            border:
                1px solid
                rgba(96,165,250,.12);
        }


        .step.done {

            color: #4ade80;

            background:
                rgba(34,197,94,.05);

            border:
                1px solid
                rgba(34,197,94,.1);
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            margin-top: 20px;

            color: #46536b;

            font-size: 7px;

            letter-spacing: 2px;

            text-transform:
                uppercase;
        }


        .footer span {
            color: #668cff;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            .loader-box {
                padding:
                    22px 16px;
            }

            .circle-loader {
                width: 110px;
                height: 110px;
            }

            .steps {
                gap: 5px;
            }

            .step {
                font-size: 6px;
            }
        }

    </style>

</head>


<body>


    <!-- Background -->

    <div class="grid"></div>

    <div class="glow"></div>

    <div
        class="particles"
        id="particles">
    </div>


    <!-- Loader -->

    <main class="loader-screen">


        <div class="logo">
            FUN <span>X</span>
        </div>


        <section class="loader-box">


            <div class="status-row">

                <div class="status">

                    <span class="status-dot"></span>

                    SYSTEM ONLINE

                </div>

                <span id="version">
                    BUILD 2.0
                </span>

            </div>


            <!-- Circular Loader -->

            <div class="circle-loader">

                <div class="circle"></div>

                <div class="circle-inner">

                    <span
                        class="percentage"
                        id="percentage">
                        0%
                    </span>

                </div>

            </div>


            <h2
                class="loading-title"
                id="loadingTitle">
                INITIALIZING GAME
            </h2>


            <p
                class="loading-subtitle"
                id="loadingSubtitle">
                Preparing your FUN X experience...
            </p>


            <!-- Progress -->

            <div class="progress-track">

                <div
                    class="progress-bar"
                    id="progressBar">
                </div>

            </div>


            <!-- Steps -->

            <div class="steps">

                <div
                    class="step active"
                    id="step1">
                    SYSTEM
                </div>

                <div
                    class="step"
                    id="step2">
                    ASSETS
                </div>

                <div
                    class="step"
                    id="step3">
                    LAUNCH
                </div>

            </div>


        </section>


        <div class="footer">
            PRIVATE BUILD · <span>FUN X</span>
        </div>


    </main>


    <script>

        "use strict";


        // =================================================
        // التحقق من الدخول
        // =================================================

        if (
            sessionStorage.getItem("fx_auth") !== "1"
        ) {

            window.location.replace(
                "secure-login.html"
            );
        }


        // =================================================
        // العناصر
        // =================================================

        const percentage =
            document.getElementById(
                "percentage"
            );

        const progressBar =
            document.getElementById(
                "progressBar"
            );

        const loadingTitle =
            document.getElementById(
                "loadingTitle"
            );

        const loadingSubtitle =
            document.getElementById(
                "loadingSubtitle"
            );

        const step1 =
            document.getElementById(
                "step1"
            );

        const step2 =
            document.getElementById(
                "step2"
            );

        const step3 =
            document.getElementById(
                "step3"
            );


        // =================================================
        // إنشاء الجزيئات
        // =================================================

        const particles =
            document.getElementById(
                "particles"
            );


        for (
            let i = 0;
            i < 45;
            i++
        ) {

            const particle =
                document.createElement(
                    "span"
                );


            particle.className =
                "particle";


            particle.style.left =
                Math.random() * 100 + "%";


            particle.style.top =
                Math.random() * 100 + "%";


            particle.style.animationDuration =
                5 + Math.random() * 9 + "s";


            particle.style.animationDelay =
                Math.random() * 6 + "s";


            const size =
                1 + Math.random() * 2;


            particle.style.width =
                size + "px";

            particle.style.height =
                size + "px";


            particles.appendChild(
                particle
            );
        }


        // =================================================
        // مراحل التحميل
        // =================================================

        const stages = [

            {
                max: 30,

                title:
                    "INITIALIZING SYSTEM",

                subtitle:
                    "Checking FUN X core systems..."
            },

            {
                max: 58,

                title:
                    "LOADING ASSETS",

                subtitle:
                    "Preparing game resources..."
            },

            {
                max: 82,

                title:
                    "CONNECTING",

                subtitle:
                    "Preparing your game hub..."
            },

            {
                max: 100,

                title:
                    "LAUNCHING FUN X",

                subtitle:
                    "Everything is ready."
            }

        ];


        // =================================================
        // التقدم
        // =================================================

        let progress = 0;


        const loader =
            setInterval(() => {

                progress +=
                    Math.floor(
                        Math.random() * 4
                    ) + 1;


                if (progress > 100) {
                    progress = 100;
                }


                percentage.textContent =
                    `${progress}%`;


                progressBar.style.width =
                    `${progress}%`;


                updateStage(
                    progress
                );


                if (progress >= 100) {

                    clearInterval(
                        loader
                    );


                    setTimeout(() => {

                        window.location.replace(
                            "wep game.html"
                        );

                    }, 500);
                }

            }, 90);


        // =================================================
        // تحديث المرحلة
        // =================================================

        function updateStage(value) {

            const stage =
                stages.find(
                    item => value <= item.max
                ) || stages[stages.length - 1];


            loadingTitle.textContent =
                stage.title;


            loadingSubtitle.textContent =
                stage.subtitle;


            // System
            if (value >= 1) {

                step1.classList.add(
                    "active"
                );
            }


            if (value >= 30) {

                step1.classList.remove(
                    "active"
                );

                step1.classList.add(
                    "done"
                );

                step2.classList.add(
                    "active"
                );
            }


            if (value >= 58) {

                step2.classList.remove(
                    "active"
                );

                step2.classList.add(
                    "done"
                );

                step3.classList.add(
                    "active"
                );
            }


            if (value >= 82) {

                step3.classList.add(
                    "active"
                );
            }


            if (value >= 100) {

                step3.classList.remove(
                    "active"
                );

                step3.classList.add(
                    "done"
                );
            }
        }

    </script>

</body>

</html>
