
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FUN X</title>

    <meta
        name="theme-color"
        content="#05070d"
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {

            margin: 0;

            overflow: hidden;

            font-family:
                "Orbitron",
                "Segoe UI",
                Arial,
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at center,
                    #111a2c 0%,
                    #080d17 35%,
                    #03050a 72%,
                    #010204 100%
                );

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            user-select: none;
        }


        /* =====================================================
           AMBIENT GLOW
        ===================================================== */

        .ambient {
            position: fixed;

            width: 45vw;
            height: 45vw;

            min-width: 250px;
            min-height: 250px;

            max-width: 700px;
            max-height: 700px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(54, 121, 255, .14),
                    transparent 70%
                );

            filter: blur(30px);

            animation:
                ambientPulse
                5s
                ease-in-out
                infinite;

            pointer-events: none;
        }

        @keyframes ambientPulse {

            0%,
            100% {
                transform: scale(.92);

                opacity: .55;
            }

            50% {
                transform: scale(1.08);

                opacity: .95;
            }
        }


        /* =====================================================
           TECH GRID
        ===================================================== */

        .grid {

            position: fixed;

            inset: 0;

            background-image:
                linear-gradient(
                    rgba(77, 122, 255, .045) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(77, 122, 255, .045) 1px,
                    transparent 1px
                );

            background-size:
                45px 45px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black 0%,
                    transparent 78%
                );

            animation:
                gridMove
                18s
                linear
                infinite;

            pointer-events: none;
        }

        @keyframes gridMove {

            from {
                transform:
                    translate(0, 0);
            }

            to {
                transform:
                    translate(45px, 45px);
            }
        }


        /* =====================================================
           PARTICLES
        ===================================================== */

        .particles {

            position: fixed;

            inset: 0;

            pointer-events: none;
        }

        .particle {

            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: #9bb7ff;

            opacity: .2;

            animation:
                particleFloat
                linear
                infinite;
        }

        @keyframes particleFloat {

            from {
                transform:
                    translateY(15vh);

                opacity: 0;
            }

            20% {
                opacity: .55;
            }

            80% {
                opacity: .25;
            }

            to {
                transform:
                    translateY(-115vh);

                opacity: 0;
            }
        }


        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .splash {

            position: relative;

            z-index: 5;

            width: min(90vw, 850px);

            text-align: center;

            animation:
                splashIn
                1.1s
                cubic-bezier(.2,.8,.2,1)
                forwards;
        }

        @keyframes splashIn {

            0% {
                opacity: 0;

                transform:
                    scale(.88)
                    translateY(20px);

                filter:
                    blur(12px);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

                filter:
                    blur(0);
            }
        }


        /* =====================================================
           TOP LINE
        ===================================================== */

        .top-line {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            margin-bottom: 18px;

            color: #7094ff;

            font-size: 10px;

            letter-spacing: 5px;

            text-transform: uppercase;

            opacity: 0;

            animation:
                fadeIn
                .8s
                ease
                forwards;

            animation-delay: .4s;
        }

        .top-line::before,
        .top-line::after {

            content: "";

            width: 45px;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #4d73ff
                );
        }

        .top-line::after {

            background:
                linear-gradient(
                    90deg,
                    #4d73ff,
                    transparent
                );
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo-wrap {

            position: relative;

            display: inline-block;

            margin-bottom: 16px;
        }

        .logo-glow {

            position: absolute;

            inset: -35px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(72, 111, 255, .22),
                    transparent 68%
                );

            filter: blur(15px);

            opacity: 0;

            animation:
                logoGlow
                2.4s
                ease
                forwards;

            animation-delay:
                1.1s;
        }

        @keyframes logoGlow {

            from {
                opacity: 0;

                transform:
                    scale(.7);
            }

            to {
                opacity: 1;

                transform:
                    scale(1.15);
            }
        }

        .logo {

            position: relative;

            margin: 0;

            font-size:
                clamp(
                    4rem,
                    13vw,
                    9rem
                );

            line-height: 1;

            font-weight: 800;

            letter-spacing:
                clamp(
                    8px,
                    2vw,
                    22px
                );

            color: #fff;

            text-shadow:
                0 0 8px rgba(255,255,255,.25),
                0 0 30px rgba(70,110,255,.3),
                0 0 70px rgba(70,110,255,.15);

            opacity: 0;

            transform:
                scale(1.25)
                translateY(10px);

            animation:
                logoReveal
                1.6s
                cubic-bezier(.2,.8,.2,1)
                forwards;

            animation-delay:
                .5s;
        }

        @keyframes logoReveal {

            0% {
                opacity: 0;

                transform:
                    scale(1.25)
                    translateY(10px);

                letter-spacing:
                    35px;

                filter:
                    blur(7px);
            }

            70% {

                opacity: 1;

                filter:
                    blur(0);
            }

            100% {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

                letter-spacing:
                    clamp(
                        8px,
                        2vw,
                        22px
                    );
            }
        }


        /* =====================================================
           UNDERLINE
        ===================================================== */

        .logo-line {

            width: 0;

            height: 2px;

            margin:
                0 auto 20px;

            border-radius: 50px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #4d73ff,
                    #fff,
                    #4d73ff,
                    transparent
                );

            box-shadow:
                0 0 20px
                rgba(77,115,255,.65);

            animation:
                lineGrow
                1s
                ease
                forwards;

            animation-delay:
                1.7s;
        }

        @keyframes lineGrow {

            from {
                width: 0;
            }

            to {
                width: min(360px, 60vw);
            }
        }


        /* =====================================================
           TAG
        ===================================================== */

        .tag {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding:
                8px 14px;

            border-radius: 999px;

            color: #8fa9ff;

            background:
                rgba(43,72,150,.08);

            border:
                1px solid
                rgba(99,132,255,.2);

            font-size:
                clamp(
                    9px,
                    1.6vw,
                    12px
                );

            letter-spacing:
                4px;

            text-transform:
                uppercase;

            opacity: 0;

            animation:
                fadeUp
                .8s
                ease
                forwards;

            animation-delay:
                2.1s;
        }

        .tag-dot {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                #5d82ff;

            box-shadow:
                0 0 10px
                #5d82ff;

            animation:
                dotPulse
                1.2s
                ease-in-out
                infinite;
        }

        @keyframes dotPulse {

            0%,
            100% {
                opacity: .4;
                transform: scale(.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {

            margin-top: 24px;

            color: #6c7892;

            font-size:
                clamp(
                    9px,
                    1.5vw,
                    11px
                );

            letter-spacing:
                3px;

            text-transform:
                uppercase;

            opacity: 0;

            animation:
                fadeUp
                .8s
                ease
                forwards;

            animation-delay:
                2.45s;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            width:
                min(300px, 60vw);

            height: 2px;

            margin:
                17px auto 0;

            overflow: hidden;

            border-radius: 50px;

            background:
                rgba(255,255,255,.06);

            opacity: 0;

            animation:
                fadeIn
                .7s
                ease
                forwards;

            animation-delay:
                2.35s;
        }

        .loading-bar {

            width: 0;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #395cff,
                    #7ba0ff,
                    #fff
                );

            box-shadow:
                0 0 12px
                rgba(87,119,255,.7);

            animation:
                loading
                3.5s
                linear
                forwards;
        }

        @keyframes loading {

            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }


        /* =====================================================
           SKIP HINT
        ===================================================== */

        .skip {

            position: fixed;

            bottom: 22px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 10;

            color: #536078;

            font-size: 9px;

            letter-spacing: 2px;

            text-transform:
                uppercase;

            opacity: 0;

            animation:
                fadeIn
                .8s
                ease
                forwards;

            animation-delay:
                2.7s;
        }


        /* =====================================================
           CORNER DETAILS
        ===================================================== */

        .corner {

            position: fixed;

            width: 35px;
            height: 35px;

            opacity: .35;
        }

        .corner::before,
        .corner::after {

            content: "";

            position: absolute;

            background:
                #5479ff;
        }

        .corner::before {

            width: 100%;
            height: 1px;

            top: 0;
            left: 0;
        }

        .corner::after {

            width: 1px;
            height: 100%;

            top: 0;
            left: 0;
        }

        .top-left {
            top: 20px;
            left: 20px;
        }

        .top-right {
            top: 20px;
            right: 20px;

            transform:
                rotate(90deg);
        }

        .bottom-left {
            bottom: 20px;
            left: 20px;

            transform:
                rotate(-90deg);
        }

        .bottom-right {
            bottom: 20px;
            right: 20px;

            transform:
                rotate(180deg);
        }


        /* =====================================================
           FADE ANIMATIONS
        ===================================================== */

        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeUp {

            from {
                opacity: 0;

                transform:
                    translateY(12px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 600px) {

            .top-line {
                letter-spacing: 3px;
            }

            .logo {
                letter-spacing: 7px;
            }

            .corner {
                width: 25px;
                height: 25px;
            }

            .corner.top-left {
                top: 12px;
                left: 12px;
            }

            .corner.top-right {
                top: 12px;
                right: 12px;
            }

            .corner.bottom-left {
                bottom: 12px;
                left: 12px;
            }

            .corner.bottom-right {
                bottom: 12px;
                right: 12px;
            }

            .skip {
                bottom: 15px;

                font-size: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration:
                    .01ms !important;

                animation-iteration-count:
                    1 !important;

                scroll-behavior:
                    auto !important;
            }
        }

    </style>

</head>


<body>


    <!-- Ambient Light -->
    <div class="ambient"></div>


    <!-- Tech Grid -->
    <div class="grid"></div>


    <!-- Particles -->
    <div
        class="particles"
        id="particles">
    </div>


    <!-- Corner UI -->
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>


    <!-- Main Splash -->
    <main class="splash">

        <div class="top-line">
            FUN X SYSTEM
        </div>


        <div class="logo-wrap">

            <div class="logo-glow"></div>

            <h1 class="logo">
                FUN X
            </h1>

        </div>


        <div class="logo-line"></div>


        <div class="tag">

            <span class="tag-dot"></span>

            PRIVATE BUILD

        </div>


        <div class="status">
            INITIALIZING EXPERIENCE
        </div>


        <div class="loading">

            <div
                class="loading-bar">
            </div>

        </div>

    </main>


    <div class="skip">
        CLICK ANYWHERE TO CONTINUE
    </div>


    <script>

        "use strict";


        // ==============================================
        // PARTICLES
        // ==============================================

        const particles =
            document.getElementById("particles");


        for (let i = 0; i < 55; i++) {

            const particle =
                document.createElement("span");

            particle.className =
                "particle";


            particle.style.left =
                Math.random() * 100 + "%";


            particle.style.top =
                85 + Math.random() * 25 + "%";


            particle.style.animationDuration =
                6 + Math.random() * 9 + "s";


            particle.style.animationDelay =
                Math.random() * 8 + "s";


            const size =
                1 + Math.random() * 2;


            particle.style.width =
                size + "px";

            particle.style.height =
                size + "px";


            particles.appendChild(
                particle
            );
        }


        // ==============================================
        // الانتقال
        // ==============================================

        let redirected = false;


        function goToLogin() {

            if (redirected) {
                return;
            }

            redirected = true;

            window.location.href =
                "secure-login.html";
        }


        // الانتقال التلقائي
        setTimeout(
            goToLogin,
            4500
        );


        // الضغط لتخطي الشاشة
        document.addEventListener(
            "click",
            goToLogin
        );


        // زر Enter
        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    goToLogin();
                }
            }
        );

    </script>

</body>

</html>
