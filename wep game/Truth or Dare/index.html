
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🔥 الصراحة والجرأة | Fun X</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="stars"></div>

    <div class="moon"></div>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>


    <main class="container">

        <!-- Header -->
        <header class="hero">

            <div class="logo">
                🔥
            </div>

            <div>
                <h1>الصراحة والجرأة</h1>
                <p>اختار تحديك وابدأ الجولة 🎮</p>
            </div>

        </header>


        <!-- Stats -->
        <section class="stats">

            <div class="stat">
                <span>🎯 الجولة</span>
                <strong id="round">0</strong>
            </div>

            <div class="stat">
                <span>🎤 صراحة</span>
                <strong id="truthCount">0</strong>
            </div>

            <div class="stat">
                <span>⚡ جرأة</span>
                <strong id="dareCount">0</strong>
            </div>

        </section>


        <!-- Game -->
        <section class="game-area">

            <div class="choice-buttons">

                <button
                    class="game-btn truth"
                    onclick="getQuestion('truth')">

                    <span class="btn-icon">🎤</span>

                    <span>
                        <small>اختر</small>
                        سؤال صراحة
                    </span>

                </button>


                <button
                    class="game-btn dare"
                    onclick="getQuestion('dare')">

                    <span class="btn-icon">⚡</span>

                    <span>
                        <small>اختر</small>
                        تحدي جرأة
                    </span>

                </button>

            </div>


            <!-- Question Card -->
            <div
                id="questionBox"
                class="question-card idle">

                <div class="question-icon">
                    🎴
                </div>

                <h2>جاهز؟</h2>

                <p>
                    اختر صراحة أو جرأة لبدء اللعبة
                </p>

            </div>


            <!-- Controls -->
            <div class="actions">

                <button
                    id="newQuestionBtn"
                    class="action-btn"
                    onclick="newQuestion()">

                    🔄 سؤال جديد

                </button>

                <button
                    class="action-btn secondary"
                    onclick="resetGame()">

                    ♻️ إعادة اللعبة

                </button>

            </div>

        </section>


        <!-- Tip -->
        <div class="tip">
            💡 <span>خلي التحديات ممتعة ومحترمة، وأي لاعب يقدر يرفض تحدي مش مناسب له.</span>
        </div>


        <!-- Footer -->
        <footer>
            <span>Powered by</span>
            <strong>Fun X</strong>
            <span>❤️</span>
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
