
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#06111f"
    >

    <title>FUN X Learn HTML 💻</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- الخلفية -->

    <div class="background-grid"></div>

    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <div id="stars" class="stars"></div>


    <!-- الهيدر -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-icon">
                💻
            </div>

            <div>
                <h1>FUN X</h1>
                <span>LEARN HTML</span>
            </div>

        </div>


        <div class="header-actions">

            <div class="progress-mini">

                <span>التقدم</span>

                <strong id="progressPercent">
                    0%
                </strong>

            </div>

            <button
                id="mode-toggle"
                class="icon-btn"
                type="button"
                title="تغيير المظهر">
                🌙
            </button>

        </div>

    </header>


    <!-- المحتوى -->

    <main class="app">


        <!-- مقدمة -->

        <section class="hero">

            <div class="hero-badge">
                🚀 FUN X ACADEMY
            </div>

            <h2>
                تعلم <span>HTML</span> من الصفر
            </h2>

            <p>
                40 درسًا تفاعليًا، اكتب الكود وشاهده يعمل أمامك.
            </p>

        </section>


        <!-- تخطيط المنصة -->

        <section class="workspace">


            <!-- قائمة الدروس -->

            <aside class="lesson-sidebar">

                <div class="sidebar-title">

                    <div>
                        <strong>📚 الدروس</strong>
                        <small id="lessonCount">
                            40 درس
                        </small>
                    </div>

                </div>


                <div class="lesson-search">

                    <span>🔎</span>

                    <input
                        id="lessonSearch"
                        type="search"
                        placeholder="ابحث عن درس..."
                        autocomplete="off"
                    >

                </div>


                <div
                    id="lessonList"
                    class="lesson-list">
                </div>

            </aside>


            <!-- منطقة الدرس -->

            <section class="lesson-area">

                <div class="lesson-card">


                    <!-- عنوان الدرس -->

                    <div class="lesson-heading">

                        <div>

                            <span
                                class="lesson-badge"
                                id="lessonBadge">
                                LESSON 01
                            </span>

                            <h2 id="lesson-title"></h2>

                        </div>

                        <div
                            id="lessonPercent"
                            class="lesson-percent">
                            2%
                        </div>

                    </div>


                    <!-- شريط التقدم -->

                    <div class="progress-track">

                        <div
                            id="lessonProgress"
                            class="progress-bar">
                        </div>

                    </div>


                    <!-- الشرح -->

                    <div class="explanation">

                        <div class="section-label">
                            📖 شرح الدرس
                        </div>

                        <p id="lesson-content"></p>

                    </div>


                    <!-- مثال -->

                    <div class="example-section">

                        <div class="section-header">

                            <div class="section-label">
                                💡 مثال
                            </div>

                            <button
                                id="copy-example-btn"
                                class="small-action"
                                type="button">
                                📋 نسخ المثال
                            </button>

                        </div>

                        <pre
                            class="code"
                            id="lesson-code">
                        </pre>

                    </div>


                    <!-- المحرر -->

                    <div class="editor-section">

                        <div class="section-header">

                            <label
                                for="editor"
                                class="section-label">
                                ⌨️ محرر الكود
                            </label>

                            <span
                                id="saveStatus"
                                class="save-status">
                                محفوظ تلقائيًا
                            </span>

                        </div>


                        <textarea
                            id="editor"
                            spellcheck="false"
                            autocomplete="off"
                            autocapitalize="off"
                            placeholder="اكتب كود HTML هنا...">
                        </textarea>

                    </div>


                    <!-- المعاينة -->

                    <div class="preview-section">

                        <div class="section-header">

                            <div class="section-label">
                                🖥️ المعاينة
                            </div>

                            <button
                                id="clear-preview-btn"
                                class="small-action"
                                type="button">
                                🧹 مسح
                            </button>

                        </div>


                        <iframe
                            id="preview"
                            title="معاينة الكود"
                            sandbox="allow-scripts">
                        </iframe>

                    </div>


                    <!-- أزرار التحكم -->

                    <div class="controls">

                        <button
                            id="prev-btn"
                            class="control-btn secondary"
                            type="button">
                            ⬅ السابق
                        </button>

                        <button
                            id="copy-btn"
                            class="control-btn"
                            type="button">
                            📋 نسخ
                        </button>

                        <button
                            id="run-btn"
                            class="control-btn run"
                            type="button">
                            ▶ تشغيل
                        </button>

                        <button
                            id="next-btn"
                            class="control-btn"
                            type="button">
                            التالي ➡
                        </button>

                    </div>


                    <!-- العداد -->

                    <div class="lesson-footer">

                        <span id="lesson-counter">
                            درس 1 من 40
                        </span>

                        <span id="completionText">
                            0 من 40 مكتملة
                        </span>

                    </div>

                </div>

            </section>

        </section>

    </main>


    <!-- Toast -->

    <div
        id="toast"
        class="toast">
    </div>


    <script src="script.js"></script>

</body>

</html>
